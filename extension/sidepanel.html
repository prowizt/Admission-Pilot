<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대동대 AI 헬퍼</title>
  <script src="tailwindcss.js"></script>
  <link rel="stylesheet" as="style" crossorigin
    href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    /* 전체 폰트 적용 및 스크롤바 디자인 */
    body {
      font-family: 'Pretendard', sans-serif;
    }

    ::-webkit-scrollbar {
      width: 6px;
    }

    ::-webkit-scrollbar-thumb {
      background-color: #cbd5e1;
      border-radius: 10px;
    }
  </style>
</head>

<body class="bg-gray-50 flex flex-col h-screen text-sm min-w-0 m-0 p-0">

  <div
    class="bg-indigo-900 text-white px-4 py-6 shadow-md shrink-0 flex justify-between items-center z-10 w-full rounded-none">
    <div class="flex items-center gap-2">
      <img src="logo.png" class="w-8 h-8 rounded-full bg-white p-0.5" alt="Logo">
      <div>
        <h1 class="font-extrabold text-sm tracking-wide">입시처 업무 헬퍼</h1>
        <p class="text-[10px] text-indigo-200 font-medium">Staff-Only Mode</p>
      </div>
    </div>
    <div class="flex items-center gap-1.5">
      <span class="text-[10px] text-indigo-200">Server</span>
      <div class="w-2 h-2 bg-emerald-400 rounded-full animate-pulse shadow-[0_0_5px_#34d399]" title="Online"></div>
    </div>
  </div>

  <div class="bg-white border-b border-gray-200 shrink-0 shadow-sm z-0">
    <button id="btn-toggle-settings"
      class="w-full px-4 py-2 text-left text-xs font-bold text-gray-600 bg-gray-100 hover:bg-gray-200 flex justify-between items-center transition-colors">
      <span>⚙️ 내 AI 모델 관리 (Key 통합)</span>
      <span id="settings-arrow">▼</span>
    </button>
    <div id="settings-body" class="hidden p-3 bg-gray-50 border-t border-gray-200 space-y-3">
      <div>
        <label class="block text-[10px] font-bold text-gray-500 mb-1">작동할 AI 모델 세트 선택</label>
        <div class="flex gap-1">
          <select id="saved-models-select"
            class="flex-1 text-xs px-2 py-1.5 bg-white border border-gray-300 rounded-md outline-none focus:border-indigo-500 shadow-inner">
          </select>
          <button id="btn-edit-model"
            class="hidden px-2 py-1 bg-blue-50 text-blue-600 border border-blue-200 hover:bg-blue-100 rounded text-[10px] font-bold transition-colors">수정</button>
          <button id="btn-delete-model"
            class="hidden px-2 py-1 bg-red-50 text-red-600 border border-red-200 hover:bg-red-100 rounded text-[10px] font-bold transition-colors">삭제</button>
        </div>
      </div>

      <div class="border-t border-gray-200 pt-2 space-y-2">
        <div class="flex justify-between items-center">
          <p id="form-title" class="text-[10px] font-bold text-indigo-600">➕ 나만의 AI 모델 세트 추가</p>
          <button id="btn-cancel-edit" class="hidden text-[10px] text-gray-400 hover:text-gray-600 underline">수정
            취소</button>
        </div>
        <input type="hidden" id="edit-model-id" value="" />
        <input type="text" id="new-model-alias" placeholder="구분용 이름 (예: 종량제 3.0 테스트용)"
          class="w-full text-xs px-2 py-1.5 bg-white border border-gray-300 rounded outline-none focus:border-indigo-400" />
        <input type="text" id="new-model-id" placeholder="실제 모델명 (예: gemini-3-flash-preview)"
          class="w-full text-[11px] font-mono px-2 py-1.5 bg-white border border-gray-300 rounded outline-none focus:border-indigo-400" />
        <div class="flex gap-1.5">
          <input type="password" id="new-model-apikey" placeholder="해당 모델용 API Key"
            class="flex-1 text-xs px-2 py-1.5 bg-white border border-gray-300 rounded outline-none focus:border-indigo-400" />
          <button type="button" id="btn-add-model"
            class="px-3 py-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold rounded shadow-sm whitespace-nowrap active:scale-95">저장</button>
        </div>
      </div>
    </div>
  </div>

  <div id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50 flex flex-col custom-scrollbar">
    <div class="flex justify-start">
      <div
        class="bg-white border border-gray-200 text-gray-700 p-3 rounded-2xl rounded-tl-none shadow-sm max-w-[85%] leading-relaxed text-sm">
        안녕하세요! 교직원 전용 업무 헬퍼입니다.<br />질문을 입력하시거나, 현재 화면을 스크랩하여 검토를 지시해 주세요.
      </div>
    </div>
  </div>

  <div class="p-3 bg-indigo-900 border-t border-indigo-950 shrink-0 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
    <div class="flex items-center gap-2 mb-2.5">
      <button id="btn-scrap"
        class="text-[11px] font-bold px-2.5 py-1.5 bg-slate-100 text-slate-600 hover:bg-slate-200 rounded-md border border-slate-300 transition-colors flex items-center gap-1 shadow-sm active:scale-95">
        📄 현재 화면 텍스트 스크랩
      </button>
      <span id="scrap-status" class="text-[11px] text-emerald-600 font-bold hidden bg-emerald-50 px-2 py-1 rounded">✅
        스크랩 완료</span>
    </div>

    <div class="relative">
      <textarea id="chat-input" rows="2" placeholder="질문을 입력하세요... (Shift+Enter로 줄바꿈)"
        class="w-full text-sm px-3 py-2.5 pr-12 bg-white border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-100 focus:border-indigo-500 resize-none custom-scrollbar shadow-inner"></textarea>
      <button id="btn-send"
        class="absolute right-2 bottom-2.5 w-8 h-8 flex items-center justify-center bg-indigo-600 text-white rounded-md hover:bg-indigo-700 transition-all shadow-md active:scale-90 disabled:opacity-50 disabled:cursor-not-allowed">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor"
          class="w-4 h-4 translate-x-[-1px] translate-y-[1px]">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" />
        </svg>
      </button>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>

</html>
