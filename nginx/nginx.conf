worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # [0] HTTP 접근 시 HTTPS 강제 리다이렉트 (80 -> 443)
    server {
        listen       80;
        server_name  ipw.daedong.ac.kr localhost;
        return 301 https://$host$request_uri;
    }

    # [1] 일반 학생용 챗봇 서버 (443번 포트 HTTPS)
    server {
        listen       443 ssl;
        server_name  ipw.daedong.ac.kr localhost;

        ssl_certificate      ssl/fullchain.crt;
        ssl_certificate_key  ssl/private.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # 프론트엔드 (학생용)
        location / {
            root   "C:/actions-runner/_work/Admission-Pilot/Admission-Pilot/student-web/dist";
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 백엔드 API
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # [2] 관리자(교직원)용 대시보드 서버 (8443번 포트 HTTPS)
    server {
        listen       8443 ssl;
        server_name  ipw.daedong.ac.kr localhost;

        ssl_certificate      ssl/fullchain.crt;
        ssl_certificate_key  ssl/private.key;

        ssl_session_cache    shared:SSL:1m;
        ssl_session_timeout  5m;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers  HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers  on;

        # 프론트엔드 (관리자용)
        location / {
            root   "C:/actions-runner/_work/Admission-Pilot/Admission-Pilot/frontend/dist";
            index  index.html index.htm;
            try_files $uri $uri/ /index.html;
        }

        # 백엔드 API (관리자 화면에서도 API를 호출하므로 동일하게 연결)
        location /api/ {
            proxy_pass http://127.0.0.1:8000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
