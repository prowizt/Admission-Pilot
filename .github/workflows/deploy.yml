name: Deploy Admission Pilot

on:
  push:
    branches:
      - main
      - master # 보통 깃허브 기본 브랜치가 main 또는 master입니다.
    paths-ignore:
      - '**.md'

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 🛑 Stop existing PM2 process
        run: |
          try { pm2 delete admission-backend } catch {}
          try { taskkill /f /im python.exe } catch {}
        continue-on-error: true

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4


      - name: 📦 Setup Python Environment
        run: |
          cd backend
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔐 Load Server Environment Variables
        run: |
          $safeEnvPath = "C:\actions-runner\.env"
          $targetEnvPath = "$env:GITHUB_WORKSPACE\backend\.env"
          if (Test-Path $safeEnvPath) {
              Write-Host "Found .env file at $safeEnvPath. Copying to backend..."
              Copy-Item -Path $safeEnvPath -Destination $targetEnvPath -Force
          } else {
              Write-Host "Warning: No .env file found at $safeEnvPath. Server might lack API keys."
          }

      - name: ⚛️ Build React Frontend (Student)
        run: |
          cd student-web
          npm install
          npm run build

      - name: 🛠️ Build Admin Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: 🌐 Update Nginx Configuration
        run: |
          $repoNginx = "$env:GITHUB_WORKSPACE\nginx\nginx.conf"
          $nginxDir = "C:\tools\nginx-1.31.2"
          $serverNginx = "$nginxDir\conf\nginx.conf"
          
          if ((Test-Path $repoNginx) -and (Test-Path $nginxDir)) {
              Write-Host "Found nginx.conf in repo and Nginx is installed. Updating configuration..."
              Copy-Item -Path $repoNginx -Destination $serverNginx -Force
              
              Write-Host "Reloading Nginx..."
              cd $nginxDir
              .\nginx.exe -s reload
          } else {
              Write-Host "Nginx is not installed at $nginxDir or repo config is missing. Skipping Nginx update."
          }

      - name: 🚀 Start or Restart Backend (PM2)
        run: |
          $pythonExe = "$env:GITHUB_WORKSPACE\backend\venv\Scripts\python.exe"
          $mainPy = "$env:GITHUB_WORKSPACE\backend\main.py"
          
          # PM2에 등록되어 있는지 문자열 검색으로 확인 (JSON 파싱 버그 방지)
          $exists = pm2 list | Select-String "admission-backend"
          
          if ($exists) {
              Write-Host "Restarting existing PM2 process..."
              pm2 restart admission-backend
          } else {
              Write-Host "Starting new PM2 process..."
              # PM2가 파이썬 환경을 제대로 인식하도록 파이썬 실행 파일을 직접 인터프리터로 지정
              cd $env:GITHUB_WORKSPACE\backend
              $venvPython = "$env:GITHUB_WORKSPACE\backend\venv\Scripts\python.exe"
              pm2 start main.py --interpreter $venvPython --name "admission-backend"
              pm2 save
          }
