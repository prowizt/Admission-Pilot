name: Deploy Admission Pilot

on:
  push:
    branches:
      - main
      - master # 보통 깃허브 기본 브랜치가 main 또는 master입니다.

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: 🛑 Stop existing PM2 process
        run: |
          pm2 stop admission-backend || exit 0
        continue-on-error: true

      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 📦 Setup Python Environment
        run: |
          cd backend
          python -m venv venv
          .\venv\Scripts\Activate.ps1
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: ⚛️ Build React Frontend (Student)
        run: |
          cd student-web
          npm install
          npm run build

      - name: 🛠️ Build Admin Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: 🚀 Start or Restart Backend (PM2)
        run: |
          $pythonExe = "$env:GITHUB_WORKSPACE\backend\venv\Scripts\python.exe"
          $mainPy = "$env:GITHUB_WORKSPACE\backend\main.py"
          
          # PM2에 등록되어 있는지 문자열 검색으로 확인 (JSON 파싱 버그 방지)
          $exists = pm2 list | Select-String "admission-backend"
          
          if ($exists) {
              Write-Host "Restarting existing PM2 process..."
              pm2 restart admission-backend
          } else {
              Write-Host "Starting new PM2 process..."
              # 파이썬 가상환경 호환성을 위해 배치 파일로 PM2 구동
              cd $env:GITHUB_WORKSPACE\backend
              pm2 start run_backend.bat --interpreter cmd --name "admission-backend"
              pm2 save
          }
